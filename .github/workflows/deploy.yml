name: Deploy to VPS

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER}}
          key: ${{ secrets.VPS_PRIVATE_KEY}}

          script: |
            cd ~/projects/signal

            echo "Pull latest code"
            if [ ! -d .git ]; then
              git clone https://github.com/ShivanshTiwari01/portfolio.git .
            else
              git fetch origin
              git reset --hard origin/production
            fi

            echo "Rebuild containers"
            docker compose down
            docker compose up --build -d
